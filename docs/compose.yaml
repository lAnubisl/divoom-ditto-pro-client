services:
  divoom:
    image: ${DIVOOM_IMAGE:-panfilenok/divoom-ditto-pro-client:latest}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # The host system-bus policy normally permits root to call BlueZ.
    user: "0:0"
    ports:
      - "${DIVOOM_PORT:-8080}:8080"
    environment:
      DIVOOM_ADDRESS: ${DIVOOM_ADDRESS:?Set DIVOOM_ADDRESS to the Ditoo Light MAC address}
      DIVOOM_API_KEY: ${DIVOOM_API_KEY:?Set DIVOOM_API_KEY to your secret API key}
      DIVOOM_ADAPTER: ${DIVOOM_ADAPTER:-hci0}
      DBUS_SYSTEM_BUS_ADDRESS: unix:path=/run/dbus/system_bus_socket
      DIVOOM_STATE_DIRECTORY: /data
      TZ: ${TZ:-Europe/Amsterdam}
    volumes:
      - /run/dbus:/run/dbus:ro
      - divoom-state:/data
volumes:
  divoom-state:
